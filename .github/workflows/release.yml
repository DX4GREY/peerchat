name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Build & Release Linux Asset
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutosh-varma/setup-ninja@v1.1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential \
            qt6-base-dev qt6-declarative-dev libsodium-dev libsqlite3-dev

      - name: Build Release
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPEERCHAT_BUILD_TESTS=OFF
          cmake --build build --config Release
          mkdir -p package/bin
          cp build/apps/client/PeerChat package/bin/
          cp build/services/relay/peerchat-relay package/bin/
          tar -czvf peerchat-${{ github.ref_name }}-linux-x86_64.tar.gz -C package/bin .
          sha256sum peerchat-${{ github.ref_name }}-linux-x86_64.tar.gz > peerchat-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            peerchat-${{ github.ref_name }}-linux-x86_64.tar.gz
            peerchat-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
