name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  format-check:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt update && sudo apt install -y clang-format

      - name: Verify Code Formatting
        run: |
          find apps core services tests -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run -Werror

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        build_type: [ Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Linux Setup
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential \
            ninja-build qt6-base-dev qt6-declarative-dev libsodium-dev \
            libsqlite3-dev libgtest-dev

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPEERCHAT_BUILD_TESTS=ON \
            -DPEERCHAT_BUILD_CLIENT=ON \
            -DPEERCHAT_BUILD_RELAY=ON

      # Windows Setup
      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Setup MSVC Developer Environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          setup-python: false

      - name: Install libsodium (Windows vcpkg)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libsodium:x64-windows

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;C:/vcpkg/installed/x64-windows" `
            -DPEERCHAT_BUILD_TESTS=ON `
            -DPEERCHAT_BUILD_CLIENT=ON `
            -DPEERCHAT_BUILD_RELAY=ON

      # Build and Test
      - name: Build All Targets
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$env:Qt6_DIR/bin;C:/vcpkg/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/
