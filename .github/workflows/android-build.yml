name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/client/platform/android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'apps/client/platform/android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf libtool

      - name: Install Qt 6 Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          setup-python: false

      - name: Cross-Compile libsodium for Android ARM64
        run: |
          git clone --depth 1 -b stable https://github.com/jedisct1/libsodium.git
          cd libsodium
          export ANDROID_NDK_HOME=${ANDROID_NDK_ROOT}
          ./dist-build/android-armv8-a.sh
          echo "LIBSODIUM_DIR=$(pwd)/libsodium-android-armv8-a" >> $GITHUB_ENV

      - name: Configure CMake for Android
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${Qt6_DIR}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_PREFIX_PATH="${Qt6_DIR};${{ env.LIBSODIUM_DIR }}" \
            -DLIBSODIUM_INCLUDE_DIR="${{ env.LIBSODIUM_DIR }}/include" \
            -DLIBSODIUM_LIBRARY="${{ env.LIBSODIUM_DIR }}/lib/libsodium.a" \
            -DPEERCHAT_BUILD_TESTS=OFF \
            -DPEERCHAT_BUILD_RELAY=OFF

      - name: Build Android Targets
        run: |
          cmake --build build-android

      - name: Find and Package Android APK
        run: |
          mkdir -p dist/android
          find build-android -name "*.apk" -exec cp {} dist/android/ \; || true
          if [ -d "dist/android" ] && [ "$(ls -A dist/android)" ]; then
            cd dist/android
            sha256sum *.apk > sha256sums.txt || true
          fi

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peerchat-android-arm64
          path: dist/android/
